name: Release Please

# Runs on every push to main. Reads conventional commits and maintains
# a release PR that accumulates changes, bumps the version in package.json,
# and updates CHANGELOG.md. Merge the release PR when you're ready to ship —
# merging it tags the release and publishes to npm automatically (see the publish
# job below). Nothing publishes until that release PR is merged.
#
# Bump rules while we're pre-1.0 (set in release-please-config.json):
#   fix:      -> patch   0.1.1 -> 0.1.2
#   feat:     -> patch   0.1.1 -> 0.1.2   (bump-patch-for-minor-pre-major)
#   feat!:    -> minor   0.1.1 -> 0.2.0   (bump-minor-pre-major)
# Drop both flags when we cut 1.0.0 to get standard semver.
#
# To force a specific version, put `Release-As: x.y.z` in a commit body on main:
#   git commit --allow-empty -m "chore: release 0.1.2" -m "Release-As: 0.1.2"
# The next run restages the release PR at that exact version.

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  release-please:
    name: Release PR
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}

    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'

    # npm trusted publishing (OIDC) — no NPM_TOKEN. npmjs.com is configured with
    # this repo + this workflow filename as the trusted publisher, and mints a
    # short-lived credential from the id-token below. Provenance is automatic for
    # a public repo publishing a public package.
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Trusted publishing requires node >= 22.14.0.
          node-version: "24"
          registry-url: https://registry.npmjs.org
          # Deliberately no `cache: npm` — release builds should not restore a cache.
          # (setup-node v6 spells this `package-manager-cache: false`; v4 has no such input.)

      # Trusted publishing requires npm >= 11.5.1. Node 24 is close to that line
      # depending on the patch release, so pin it up explicitly rather than hope.
      - run: npm install -g npm@latest

      - run: npm ci
      - run: npm run build

      - name: Publish
        run: npm publish --access public
