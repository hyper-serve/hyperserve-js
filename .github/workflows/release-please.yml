name: Release Please

# Runs on every push to main. Reads conventional commits and maintains
# a release PR that accumulates changes, bumps the version in package.json,
# and updates CHANGELOG.md. Merge the release PR when you're ready to ship.

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release PR
    runs-on: ubuntu-latest

    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}

    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

